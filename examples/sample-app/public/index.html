<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Reading list</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
		label { display: block; margin-top: 1rem; font-weight: 600; }
		input { width: 100%; padding: 0.5rem; font: inherit; }
		button { margin-top: 1rem; padding: 0.6rem 1.2rem; font: inherit; }
		.error { color: #a40000; }
		.ok { color: #1d6b2f; }
		li { margin: 0.25rem 0; }
	</style>
</head>
<body>
	<main>
		<h1>Reading list</h1>
		<p id="status" role="status" aria-live="polite">Loading…</p>
		<ul id="books" aria-label="Books"></ul>

		<h2>Add a book</h2>
		<form id="add" novalidate>
			<label for="title">Title</label>
			<input id="title" name="title" maxlength="200" autocomplete="off">
			<label for="author">Author</label>
			<input id="author" name="author" autocomplete="off">
			<button type="submit">Add book</button>
		</form>
		<p id="message" role="alert"></p>
	</main>
	<script>
		const $ = (id) => document.getElementById(id);

		async function load() {
			const books = await (await fetch("/api/books")).json();
			$("books").replaceChildren(...books.map((b) => {
				const li = document.createElement("li");
				li.textContent = `${b.title} — ${b.author} `;
				const del = document.createElement("button");
				del.type = "button";
				del.textContent = "Remove";
				del.setAttribute("aria-label", `Remove ${b.title}`);
				del.onclick = async () => { await fetch(`/api/books/${b.id}`, { method: "DELETE" }); load(); };
				li.append(del);
				return li;
			}));
			$("status").textContent = books.length ? `${books.length} book${books.length === 1 ? "" : "s"}` : "No books yet";
		}

		$("add").onsubmit = async (ev) => {
			ev.preventDefault();
			const res = await fetch("/api/books", {
				method: "POST",
				headers: { "content-type": "application/json" },
				body: JSON.stringify({ title: $("title").value, author: $("author").value })
			});
			const body = await res.json();
			$("message").className = res.ok ? "ok" : "error";
			$("message").textContent = res.ok ? `Added “${body.title}”.` : body.errors.join(". ");
			if (res.ok) { $("add").reset(); load(); }
		};

		load();
	</script>
</body>
</html>
