# Publishes a GitHub release for a signed <plugin>--v<version> tag that the maintainer pushed (made locally with
# `claude plugin tag --push`). It never creates or moves a tag. Per tag, in order: skip if that version already has a
# release (--v or the old -v name); the tagged commit must be on main; the tag must be annotated with a signature
# GitHub reports as verified; plugin.json and marketplace.json at that commit must match the tag; its CHANGELOG
# section is the release notes. Details: scripts/release.mjs.
# Runs on a pushed *--v* tag (that tag only), or by hand: one tag, or empty = every --v tag without a release.
# Uses only GitHub-owned actions and the gh CLI on the runner, with the workflow's own token.
name: Release plugins

on:
  push:
    tags: ["*--v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "<plugin>--v<version> to release; empty = every --v tag that has no release yet"
        required: false
        type: string

permissions: {}

# One group per ref: runs for different tags don't wait on (or cancel) each other. In a shared group GitHub keeps
# only the newest pending run and cancels older pending ones, which would drop tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create releases (never tags)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch and tag: the tagged commit, origin/main and the files at that commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Release signed --v tags
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
