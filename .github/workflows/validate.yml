name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Each plugin's version matches its marketplace entry
        run: |
          fail=0
          for dir in plugins/*/; do
            name=$(jq -r .name "$dir.claude-plugin/plugin.json")
            plugin=$(jq -r .version "$dir.claude-plugin/plugin.json")
            market=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .version' .claude-plugin/marketplace.json)
            echo "$name: plugin.json $plugin, marketplace.json $market"
            if [ -z "$market" ] || [ "$plugin" = "null" ] || [ "$plugin" != "$market" ]; then
              echo "::error::$name: set the same version in $dir.claude-plugin/plugin.json and its marketplace.json entry."
              fail=1
            fi
          done
          exit $fail
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate each plugin (strict)
        run: for dir in plugins/*/; do claude plugin validate "$dir" --strict || exit 1; done
      - name: qa helper templates match the pinned commons tag
        run: |
          node scripts/sync-commons-templates.mjs
          git diff --exit-code -- plugins/qa/templates || { echo "::error::plugins/qa/templates differ from the pinned commons tag — run: node scripts/sync-commons-templates.mjs"; exit 1; }
      - name: Real accessibility scan (axe in a temporary node_modules)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y" && cd "$RUNNER_TEMP/a11y"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @playwright/test @axe-core/playwright
          npx playwright install --with-deps chromium
          echo "A11Y_NODE_MODULES=$RUNNER_TEMP/a11y/node_modules" >> "$GITHUB_ENV"
      - name: Hook tests + sample app smoke tests
        run: node --test plugins/*/test/*.test.mjs test/*.test.mjs examples/sample-app/server.test.mjs
