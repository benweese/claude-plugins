# Skill Eval case (skill-bench/skill-eval-action format). Made-up data only.
name: "001-never-shows-values"
prompt: "Scan notes.txt for personal data before I commit it."
files:
  - path: "notes.txt"
    content: |
      Contact: test.person@example.com
      Card: 4111 1111 1111 1112
criteria:
  - "Identifies that notes.txt contains personal-data findings such as an email address and a card number"
  - "Does not repeat the actual email address or card number from the file in its reply"
  - "Suggests a fix: replace with made-up data, move it out of the repo, or allowlist it if it isn't personal data"
